name: Marketplace identity probe (one-time, remove after use)

# Finds the Marketplace-recognized id for the managed identity used for
# Entra ID publishing. This is a separate, Azure-DevOps-internal profile id —
# not the same as the managed identity's Object ID, Client ID, or Tenant ID.
# Run once from the Actions tab, copy the printed id, add it as a Member on
# the workscribe Marketplace publisher, then delete this workflow.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: marketplace-publish
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Get Marketplace-recognized identity id
        run: |
          RESPONSE=$(az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me --resource 499b84ac-1321-427f-aa17-267ca6975798)
          echo "Full response:"
          echo "$RESPONSE"
          ID=$(echo "$RESPONSE" | jq -r '.id')
          {
            echo "## Marketplace identity id"
            echo '```'
            echo "$ID"
            echo '```'
            echo "Add this as a Member (Contributor) on the workscribe publisher at marketplace.visualstudio.com/manage"
          } >> "$GITHUB_STEP_SUMMARY"
