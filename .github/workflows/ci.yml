name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - uses: actions/cache@v4
        with:
          path: .vscode-test
          # key always misses (unique per run) so this job always saves an
          # updated cache at the end; restore-keys pulls the nearest previous
          # one to start from. Self-heals on a VS Code version bump in
          # .vscode-test.mjs with no manual key to keep in sync.
          key: vscode-test-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            vscode-test-${{ runner.os }}-
      - run: xvfb-run -a npm test
